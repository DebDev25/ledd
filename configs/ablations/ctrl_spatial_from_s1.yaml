# CONTROL: does the frequency stream help during TRAINING, or only at inference?
#
# Deleting the frequency stream from the trained joint model costs 0.0031 AUC, which
# invites the conclusion that it is redundant. That conclusion is wrong, and this
# config is what shows it: train the spatial stream alone under a matched protocol
# and the result is 0.9083 +/- 0.0032 against 0.9230 +/- 0.0046 for the joint model
# -- a 0.0146 gap at 3.7 sigma over three seeds.
#
# "Matched" is doing the work here. Any difference in initialisation, schedule or
# epoch count between this run and stage3_joint would confound the comparison, so
# everything below mirrors stage3_joint exactly: the same Stage-1 spatial checkpoint,
# the same 10 epochs, the same two learning rates, the same warmup. The ONLY
# difference is that there is no second stream.
#
# The best-epoch difference is 0.0028, so this effect is invisible if you report
# best epoch rather than mean -- which is why it took a dedicated control to find.
#
#   python scripts/train.py --config configs/ablations/ctrl_spatial_from_s1.yaml \
#       --set data.root=$DATA train.seed=1
_base_: ../default.yaml
stage: spatial
init:
  spatial_ckpt: runs/stage1_spatial/best.pth    # identical start to the joint run
model:
  spatial: {pretrained: true}
loss:
  supcon_weight: 0.0          # joint run's auxiliaries earned nothing (Table III);
  band_entropy_weight: 0.0    # band entropy is undefined without the frequency stream
train:
  epochs: 10                  # matched to stage3_joint
  batch_size: 96
  lr_backbone: 1.0e-5         # matched: streams already 10x down
  lr_new: 1.0e-3
  ckpt_dir: runs/ctrl_spatial_from_s1
